<p>
    The model maps an image of shape <code>(B, C, H, W)</code> into a token sequence and runs it through the encoder:
    patch-embed to <code>(B, N, D)</code>, prepend the <code>[CLS]</code> token to get <code>(B, N+1, D)</code>, add
    positional embeddings, pass through <code>L</code> encoder layers, then project the final <code>[CLS]</code>
    representation to class logits.
  </p>
